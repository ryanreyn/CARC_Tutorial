name: Conda Build & Test

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from git tag or commit
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            VERSION=$(git describe --tags --abbrev=0)
          else
            VERSION="g$(git rev-parse --short HEAD)"
          fi
          echo "GIT_DESCRIBE_TAG=$VERSION" >> $GITHUB_ENV

      - name: Set up Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: buildenv
          create-args: >-
            python=3.10
            conda-build
            anaconda-client
            pip
          init-shell: bash
          cache-downloads: true
          cache-environment: true
          condarc: |
            channels:
              - conda-forge
              - defaults

      - name: Build conda package with micromamba
        shell: bash -l {0}
        run: |
          micromamba run -n buildenv conda-build ./conda_recipe/ --output-folder output

      - name: Test CLI directly from built package (local file install)
        shell: bash -l {0}
        run: |
          # Create and activate testenv using micromamba and 'run'
          micromamba create -y -n testenv python=3.10 pip

          # Install built package from local conda tarball (simulate local channel)
          micromamba run -n testenv conda install --use-local ./output/noarch/carc_tutorial-*.*

          # Run CLI commands inside the same environment
          micromamba run -n testenv carc-jobs-example --help
          micromamba run -n testenv carc-migrate --help


      - name: Upload to Anaconda.org
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          ART_DIR=output/noarch
          micromamba run -n buildenv anaconda -t "$ANACONDA_API_TOKEN" upload \
            -u <your_channel> --label main --skip-existing \
            $ART_DIR/carc_tutorial-*.tar.bz2 $ART_DIR/carc_tutorial-*.conda || true
